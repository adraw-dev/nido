<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FEF7FF;--on:#1D1B20;--muted:#49454F;--p:#6750A4;--pc:#E8DEF8;--sc:#F3EDF7;--line:#CAC4D0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:var(--bg);color:var(--on);font:400 14px/1.4 Roboto,sans-serif;position:relative}
header{padding:44px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font:400 28px Roboto}
.av{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:500}
.sub{padding:0 16px 14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.stat{background:var(--pc);border-radius:16px;padding:14px}
.stat b{font:500 24px Roboto;display:block}
.stat small{color:var(--muted)}
h2{font:500 14px Roboto;color:var(--muted);padding:4px 16px 8px}
.list{margin:0 16px 16px;background:var(--sc);border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:14px;padding:14px 16px}
.cb{width:20px;height:20px;border:2px solid var(--muted);border-radius:3px}
.cb.on{background:var(--p);border-color:var(--p)}
.it small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;padding:0 16px 16px}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:500 13px Roboto}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--sc);display:grid;grid-template-columns:repeat(5,1fr);padding-top:12px;text-align:center;font:500 12px Roboto;color:var(--muted)}
nav i{display:block;margin:0 auto 4px;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}
nav .act i{width:64px;height:32px;border:none;border-radius:16px;background:var(--pc);margin-top:-4px}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;background:var(--pc);display:grid;place-items:center;font:400 28px Roboto;color:var(--p)}
</style></head><body>
<header><h1>Hoy</h1><div class="av">A</div></header>
<div class="sub">Lunes, 9 de noviembre</div>
<div class="stats"><div class="stat"><b>3/7</b><small>Tareas hechas</small></div><div class="stat"><b>$2,18 M</b><small>Gastado en nov.</small></div></div>
<h2>Tareas de hoy</h2>
<div class="list">
 <div class="it"><div class="cb on"></div><div>Lavar los platos<small>Laura · 8:12 a. m.</small></div></div>
 <div class="it"><div class="cb"></div><div>Pagar la administración<small>Tú · vence hoy</small></div></div>
 <div class="it"><div class="cb"></div><div>Sacar la basura<small>Los dos · 7:00 p. m.</small></div></div>
</div>
<h2>Hábitos</h2>
<div class="chips"><div class="chip">Leer · 5 🔥</div><div class="chip">Agua 4/8</div><div class="chip">Gimnasio 3/4</div></div>
<div class="fab">+</div>
<nav><div class="act"><i></i>Hoy</div><div><i></i>Tareas</div><div><i></i>Hábitos</div><div><i></i>Dinero</div><div><i></i>Garaje</div></nav>
</body></html>
